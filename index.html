<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes /</title>
<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel-hover:#1c2333;
  --border:#30363d;
  --border-soft:#21262d;
  --text:#e6edf3;
  --text-soft:#c9d1d9;
  --muted:#8b949e;
  --accent:#58a6ff;
  --accent-dim:rgba(88,166,255,.10);
  --purple:#bc8cff;
  --purple-dim:rgba(188,140,255,.12);
  --red:#f85149;
  --red-dim:rgba(248,81,73,.12);
  --green:#3fb950;
  --radius:6px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(
      ellipse 80% 60% at 50% -10%,
      rgba(88,166,255,.08),
      transparent 60%
    );
  pointer-events:none;
}

#bg-canvas{
  position:fixed;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

a{
  color:inherit;
}

/* TOP BAR */

.topbar{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.9rem 2.5rem;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,23,.85);
  backdrop-filter:blur(8px);
  gap:1rem;
}

.brand{
  display:flex;
  align-items:center;
  gap:.55rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.95rem;
}

.brand .mark{
  color:var(--accent);
  font-weight:700;
}

.brand b{
  font-weight:600;
}

.brand .slash{
  color:var(--muted);
}

.status{
  font:600 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:.45rem;
}

.status .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
}

/* MAIN */

main{
  position:relative;
  z-index:2;
  max-width:980px;
  margin:0 auto;
  padding:3.4rem 1.5rem 6rem;
}

.page-head{
  margin-bottom:2.6rem;
}

.page-head h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:2.05rem;
  font-weight:700;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  gap:.7rem;
  color:var(--text);
}

.page-head h1 .mark{
  color:var(--accent);
  font-family:ui-monospace,monospace;
}

.page-head p{
  margin-top:.65rem;
  color:var(--muted);
  font-size:.95rem;
  max-width:70ch;
}

/* FILE SECTION */

section.block{
  margin-top:2.6rem;
}

.block-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:.9rem;
  gap:1rem;
  flex-wrap:wrap;
}

.block-head h2{
  font-size:1.05rem;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:.5rem;
}

.count{
  font:600 .64rem ui-monospace,monospace;
  color:var(--muted);
  padding:.18rem .42rem;
  border:1px solid var(--border);
  border-radius:4px;
}

.file-list{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--panel);
}

.file-list-head,
.file-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 100px 90px;
  gap:1rem;
  align-items:center;
}

.file-list-head{
  padding:.55rem 1.1rem;
  background:var(--border-soft);
  border-bottom:1px solid var(--border);
  font:600 .64rem ui-monospace,monospace;
  letter-spacing:.06em;
  color:var(--muted);
  text-transform:uppercase;
}

.file-list-head span:nth-child(n+2){
  text-align:right;
}

.file-row{
  padding:.78rem 1.1rem;
  border-bottom:1px solid var(--border-soft);
  transition:background .12s;
  cursor:pointer;
}

.file-row:last-child{
  border-bottom:none;
}

.file-row:hover{
  background:var(--panel-hover);
}

.file-row:focus{
  outline:1px solid var(--accent);
  outline-offset:-1px;
  background:var(--panel-hover);
}

.file-name-cell{
  display:flex;
  align-items:center;
  gap:.8rem;
  min-width:0;
}

.file-icon{
  width:30px;
  height:30px;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--red-dim);
  color:var(--red);
}

.ext{
  font:600 .55rem ui-monospace,monospace;
}

.file-name-text{
  min-width:0;
}

.fname{
  font:500 .88rem ui-monospace,monospace;
  color:var(--text-soft);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fmeta{
  font:.65rem ui-monospace,monospace;
  color:var(--muted);
  margin-top:.15rem;
}

.file-meta{
  font:.72rem ui-monospace,monospace;
  color:var(--muted);
  text-align:right;
  white-space:nowrap;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:.35rem;
}

.icon-btn{
  width:28px;
  height:28px;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  text-decoration:none;
}

.icon-btn:hover{
  color:var(--accent);
  border-color:var(--border);
  background:var(--bg);
}

/* FOOTER */

footer{
  position:relative;
  z-index:2;
  max-width:980px;
  margin:0 auto;
  padding:0 1.5rem 3rem;
  font:.66rem ui-monospace,monospace;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:1rem;
  flex-wrap:wrap;
}

/* MODAL */

#modal{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(6,8,11,.97);
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
}

#modal.open{
  opacity:1;
  pointer-events:auto;
}

.modal-topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.9rem 1.1rem;
  border-bottom:1px solid var(--border);
  gap:1rem;
  flex-shrink:0;
}

.modal-title{
  font:.78rem ui-monospace,monospace;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.modal-controls{
  display:flex;
  align-items:center;
  gap:.45rem;
  flex-shrink:0;
}

.modal-btn{
  font:.65rem ui-monospace,monospace;
  padding:.38rem .72rem;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  cursor:pointer;
  border-radius:var(--radius);
  text-decoration:none;
}

.modal-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.modal-close{
  color:var(--red);
  border-color:rgba(248,81,73,.3);
}

.modal-close:hover{
  border-color:var(--red);
  color:var(--red);
}

.modal-body{
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2.2rem 1rem 3rem;
}

.viewer{
  width:min(1100px,95vw);
  height:calc(100vh - 125px);
  display:flex;
  justify-content:center;
}

.viewer iframe{
  width:100%;
  height:100%;
  border:1px solid var(--border);
  background:#fff;
}

/* RESPONSIVE */

@media(max-width:700px){

  .topbar{
    padding:.9rem 1.2rem;
  }

  .status{
    display:none;
  }

  main{
    padding:2.6rem 1.2rem 4rem;
  }

  .file-list-head,
  .file-row{
    grid-template-columns:minmax(0,1fr) 82px;
  }

  .file-list-head span:nth-child(2),
  .file-row .file-meta{
    display:none;
  }

  .actions{
    gap:.2rem;
  }

  .icon-btn{
    width:26px;
    height:26px;
  }

  footer{
    padding:0 1.2rem 2.5rem;
    flex-direction:column;
  }

  .page-head h1{
    font-size:1.8rem;
  }

  .viewer{
    height:calc(100vh - 115px);
  }
}
</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>

<header class="topbar">
  <div class="brand">
    <span class="mark">◈</span>
    <b>notes</b>
    <span class="slash">/</span>
  </div>

  <div class="status">
    <span class="dot"></span>
    <span>local project</span>
  </div>
</header>

<main>

  <div class="page-head">
    <h1>
      <span class="mark">⌂</span>
      Notes
    </h1>

    <p>
      A collection of mathematics and physics notes, drafts, references,
      and related study material.
    </p>
  </div>

  <section class="block">

    <div class="block-head">
      <h2>
        PDF notes
        <span class="count">1</span>
      </h2>

      <span
        class="mono"
        style="font-size:.68rem;color:var(--muted)"
      >
        ./
      </span>
    </div>

    <div class="file-list">

      <div class="file-list-head">
        <span>name</span>
        <span>type</span>
        <span>action</span>
      </div>

      <div
        class="file-row"
        data-pdf="QFT_1.pdf"
        tabindex="0"
        role="button"
        aria-label="Open QFT_1.pdf"
      >

        <div class="file-name-cell">

          <div class="file-icon">
            <span class="ext">PDF</span>
          </div>

          <div class="file-name-text">
            <div class="fname">QFT_1.pdf</div>
            <div class="fmeta">local project file</div>
          </div>

        </div>

        <div class="file-meta">
          PDF
        </div>

        <div class="actions">

          <button
            class="icon-btn view-btn"
            type="button"
            title="View"
            aria-label="View QFT_1.pdf"
          >
            ↗
          </button>

          <a
            class="icon-btn"
            href="QFT_1.pdf"
            download
            title="Download"
            aria-label="Download QFT_1.pdf"
          >
            ↓
          </a>

        </div>

      </div>

    </div>

  </section>

</main>

<footer>
  <span>1 file available</span>
  <span>view / download only</span>
</footer>

<div
  id="modal"
  role="dialog"
  aria-modal="true"
  aria-label="PDF viewer"
>

  <div class="modal-topbar">

    <span
      id="modal-title"
      class="modal-title"
    >
      QFT_1.pdf
    </span>

    <div class="modal-controls">

      <a
        class="modal-btn"
        href="QFT_1.pdf"
        download
      >
        download
      </a>

      <button
        id="modal-close"
        class="modal-btn modal-close"
        type="button"
      >
        close
      </button>

    </div>

  </div>

  <div class="modal-body">

    <div class="viewer">

      <iframe
        src="QFT_1.pdf"
        title="QFT_1.pdf"
      ></iframe>

    </div>

  </div>

</div>

<script>
'use strict';

/*
  The project contains exactly one local PDF.

  No:
  - file picker
  - folder picker
  - filesystem scan
  - fetch()
  - upload
  - external file source

  The PDF is referenced directly from the same project directory.
*/

const pdfPath = 'QFT_1.pdf';

const modal = document.getElementById('modal');
const closeButton = document.getElementById('modal-close');
const row = document.querySelector('.file-row[data-pdf]');
const viewButton = document.querySelector('.view-btn');

function openPdf(){
  modal.classList.add('open');
}

function closePdf(){
  modal.classList.remove('open');
}

row.addEventListener('dblclick', openPdf);

row.addEventListener('keydown', (event) => {

  if(event.key === 'Enter' || event.key === ' '){

    event.preventDefault();
    openPdf();

  }

});

viewButton.addEventListener('click', openPdf);

closeButton.addEventListener('click', closePdf);

modal.addEventListener('click', (event) => {

  if(event.target === modal){
    closePdf();
  }

});

document.addEventListener('keydown', (event) => {

  if(event.key === 'Escape'){
    closePdf();
  }

});


/*
  Subtle animated background inspired by the reference design.
*/

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let W = 0;
let H = 0;

const nodes = [];

function resizeCanvas(){

  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener('resize', resizeCanvas);

for(let i = 0; i < 38; i++){

  nodes.push({

    x:Math.random() * window.innerWidth,
    y:Math.random() * window.innerHeight,

    vx:(Math.random() - 0.5) * 0.18,
    vy:(Math.random() - 0.5) * 0.18,

    r:Math.random() * 1.4 + 0.4,

    phase:Math.random() * Math.PI * 2

  });

}

function drawBackground(){

  ctx.clearRect(0,0,W,H);

  for(const node of nodes){

    node.x += node.vx;
    node.y += node.vy;
    node.phase += 0.01;

    if(node.x < 0 || node.x > W){
      node.vx *= -1;
    }

    if(node.y < 0 || node.y > H){
      node.vy *= -1;
    }

  }

  for(let i = 0; i < nodes.length; i++){

    for(let j = i + 1; j < nodes.length; j++){

      const a = nodes[i];
      const b = nodes[j];

      const distance = Math.hypot(
        a.x - b.x,
        a.y - b.y
      );

      if(distance < 145){

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle =
          `rgba(88,166,255,${(1-distance/145)*0.12})`;

        ctx.lineWidth = 0.55;

        ctx.stroke();

      }

    }

  }

  for(const node of nodes){

    const alpha =
      0.25 + 0.25 * Math.sin(node.phase);

    ctx.beginPath();

    ctx.arc(
      node.x,
      node.y,
      node.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      `rgba(88,166,255,${alpha})`;

    ctx.fill();

  }

  requestAnimationFrame(drawBackground);

}

drawBackground();
</script>

</body>
</html>
